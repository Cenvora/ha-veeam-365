blueprint:
  name: Veeam 365 daily backup summary
  description: >-
    Send a once-a-day summary of your Veeam Backup for Microsoft 365 jobs: how many succeeded,
    warned or failed, and which ones need attention.

    Pick the **Last Status** sensors of the jobs to include. Optionally stay quiet on days when
    everything succeeded, so the summary only arrives when it says something.
  domain: automation
  source_url: https://github.com/Cenvora/ha-veeam-365/blob/main/blueprints/automation/veeam_365/daily_backup_summary.yaml
  author: Cenvora
  input:
    job_status_sensors:
      name: Job Last Status sensors
      description: The jobs to include in the summary.
      selector:
        entity:
          multiple: true
          filter:
            - integration: veeam_365
              domain: sensor
    report_time:
      name: Send at
      default: "08:00:00"
      selector:
        time:
    only_when_problems:
      name: Only send when something needs attention
      description: Skip the summary on days when every job succeeded.
      default: false
      selector:
        boolean:
    notification_action:
      name: Notification action
      description: >-
        What to run. Available variables: `total`, `succeeded`, `warned`, `failed`,
        `unknown_count`, `problem_jobs` (list of `{name, status}`), and ready-made `title` and
        `message`.
      selector:
        action:

mode: single

triggers:
  - trigger: time
    at: !input report_time

variables:
  job_status_sensors: !input job_status_sensors
  only_when_problems: !input only_when_problems
  # RESTJobLastStatus values, compared lower-cased for safety
  results: >-
    {{ job_status_sensors | map('states') | map('lower') | list }}
  total: "{{ job_status_sensors | count }}"
  succeeded: "{{ results | select('eq', 'success') | list | count }}"
  warned: "{{ results | select('eq', 'warning') | list | count }}"
  failed: "{{ results | select('eq', 'failed') | list | count }}"
  unknown_count: >-
    {{ results | reject('in', ['success', 'warning', 'failed']) | list | count }}
  problem_jobs: >-
    {% set ns = namespace(items=[]) %}
    {% for entity_id in job_status_sensors %}
      {% set status = states(entity_id) %}
      {% if status | lower in ['failed', 'warning'] %}
        {% set ns.items = ns.items + [{
             'name': device_attr(entity_id, 'name_by_user')
                     or device_attr(entity_id, 'name')
                     or entity_id,
             'status': status,
           }] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
  title: >-
    {{ 'Veeam 365: all ' ~ total ~ ' jobs succeeded' if failed | int == 0 and warned | int == 0
       else 'Veeam 365: ' ~ failed ~ ' failed, ' ~ warned ~ ' with warnings' }}
  message: >-
    {{ succeeded }} of {{ total }} jobs succeeded.
    {%- if problem_jobs | count > 0 %}
    Needs attention:
    {% for job in problem_jobs %}
    - {{ job.name }}: {{ job.status }}
    {%- endfor %}
    {%- endif %}
    {%- if unknown_count | int > 0 %}
    {{ unknown_count }} job(s) reported no status yet.
    {%- endif %}

conditions:
  - condition: template
    value_template: >-
      {{ not only_when_problems or failed | int > 0 or warned | int > 0 }}

actions: !input notification_action
