blueprint:
  name: Veeam 365 backup job failed
  description: >-
    Notify when a Veeam Backup for Microsoft 365 job finishes with a failure, and optionally on
    a warning too.

    Pick the **Last Status** sensors of the jobs you care about. Backup jobs and backup copy
    jobs both have one, so either can be watched here.
  domain: automation
  source_url: https://github.com/Cenvora/ha-veeam-365/blob/main/blueprints/automation/veeam_365/job_failed.yaml
  author: Cenvora
  input:
    job_status_sensors:
      name: Job Last Status sensors
      description: One or more Veeam job or copy job "Last Status" sensors to watch.
      selector:
        entity:
          multiple: true
          filter:
            - integration: veeam_365
              domain: sensor
    include_warnings:
      name: Also notify on warnings
      description: >-
        Veeam reports a run that completed with problems as a warning rather than a failure.
      default: false
      selector:
        boolean:
    notification_action:
      name: Notification action
      description: >-
        What to run when a job fails. These variables are available: `job_name`,
        `job_status`, `job_entity_id`, and ready-made `title` and `message`.
      selector:
        action:

# One automation instance can see several jobs fail in the same polling cycle
mode: queued
max: 25

triggers:
  - trigger: state
    entity_id: !input job_status_sensors

variables:
  include_warnings: !input include_warnings
  # RESTJobLastStatus is Success / Warning / Failed / Running / Stopped / Queued /
  # Disconnected / NotConfigured. Compared lower-cased because the Veeam API has shipped
  # different casing for other enums between versions.
  bad_results: "{{ ['failed', 'warning'] if include_warnings else ['failed'] }}"
  job_status: "{{ trigger.to_state.state }}"
  job_entity_id: "{{ trigger.entity_id }}"
  # Each job is its own device, so the device name is the job name
  job_name: >-
    {{ device_attr(trigger.entity_id, 'name_by_user')
       or device_attr(trigger.entity_id, 'name')
       or trigger.to_state.name | replace(' Last Status', '') }}
  title: "Veeam 365 backup failed: {{ job_name }}"
  message: "Veeam 365 job {{ job_name }} finished with status {{ job_status }}."

conditions:
  - condition: template
    value_template: "{{ job_status | lower in bad_results }}"
  # Skip the transition out of unknown/unavailable after a restart or reload, which would
  # otherwise re-notify about a failure that was already reported
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state | lower not in ['unknown', 'unavailable'] }}

actions: !input notification_action
